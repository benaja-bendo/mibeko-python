# Carnet de commandes de l'usine à textes — v1
#
# L'usine ne traite QUE ce qui figure ici (règle mission). Structure et
# proposition initiale rédigées en Phase 1 ; le CONTENU est validé et complété
# par Benji. Les champs `<à compléter>` bloquent l'acquisition du texte
# concerné (ignoré avec un message), pas celle du reste.
#
# Commandes :
#   python main.py acquire --dry-run          # découverte sans téléchargement
#   python main.py acquire [--source <id>]    # acquisition idempotente
#   python main.py ohada-recon                # rapport d'URLs OHADA à valider

version: 1

regles:
  sources_autorisees: [sgg.cg, ohada.org]
  interdits: >
    Consolidations d'éditeurs privés (ex. Droit-Afrique) : point de comparaison
    manuel uniquement, jamais une source d'acquisition.

# ---------------------------------------------------------------------------
# Séries : acquisition par lot.
# ---------------------------------------------------------------------------
series:
  - id: jo-recents
    type: journal_officiel
    description: >
      Journaux officiels en TEXTE NATIF (2005 → aujourd'hui) : le socle du droit
      positif applicable. Mesure du 06/08/2026 (PyMuPDF, échantillons réels) : les
      PDF du JO portent une couche texte à partir de 2005 (~6 000 car./page) et
      n'en portent AUCUNE avant — d'où la coupure exacte à 2005. Ce lot s'ingère
      donc sans OCR, ce qui en fait la priorité n° 1 de l'usine.
      ⚠️ Ne jamais acquérir les PDF de /textes-officiels/ (lois, décrets isolés) :
      ils sont TOUS des scans à 0 caractère, y compris les plus récents
      (congo-loi-2023-13.pdf = 8 p., 0 car.). Le texte d'un acte s'obtient en
      découpant le JO qui l'a publié, jamais son PDF isolé.
    annees: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015,
             2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    # Pages d'index à scanner (liens /JO/{AAAA}/….pdf). La page des éditions
    # spéciales est connue ; ajouter ici la page d'archives des numéros
    # ordinaires quand elle sera identifiée au premier run.
    index_pages:
      - https://www.sgg.cg/1/152/fr/journal-officiel/journaux-speciaux.html
    # Mode par défaut (recon du 04/07/2026) : autoindex Apache ouvert sur
    # /JO/{annee}/ — liste tous les PDF réellement présents, y compris les
    # variantes à suffixe imprévisible (-2, -13-5, -interactif…). Ne jamais
    # reconstruire un nom de fichier à partir du seul numéro.
    autoindex:
      actif: true
    # Filet, utilisé seulement si l'autoindex est fermé pour une année donnée :
    # sonde congo-jo-{annee}-{n}.pdf (HEAD, poli), n croissant, arrêt après
    # 5 absences consécutives.
    enumeration:
      actif: true
      max_numero: 60
      stop_apres_absents: 5

  - id: jo-archives
    type: journal_officiel
    description: >
      Journaux officiels ANTÉRIEURS à 2005 : archive historique intégralement
      SCANNÉE (couche texte à 0 caractère, vérifié sur 1946, 1963, 1981, 1985,
      1990, 1997, 2004). Chaque numéro exige un passage MinerU/OCR — d'où la
      série séparée : ce lot ne doit jamais retarder `jo-recents`, qui lui ne
      coûte aucun OCR. Valeur réelle malgré tout : de nombreux textes de cette
      période sont encore en vigueur faute d'abrogation (code de procédure
      pénale de 1963, code de la famille de 1984, code du travail de 1975…).
      Années établies par énumération de l'autoindex le 06/08/2026, PAS par le
      menu déroulant du site : celui-ci cache 12 années pourtant présentes
      (1975, 1991 à 1996, 1998, 2000 à 2003). Seules 9 années n'ont réellement
      aucun répertoire : 1953, 1976, 1977, 1979, 1986 à 1989 et 1999.
      La couverture s'effondre de 1974 à 2004 (souvent 1 à 4 numéros par an,
      contre ~25 avant 1974) : c'est un trou de l'archive en ligne, pas un trou
      du droit — ces années-là devront être complétées hors ligne.
    annees: [1946, 1947, 1948, 1949, 1950, 1951, 1952, 1954, 1955, 1956, 1957,
             1958, 1959, 1960, 1961, 1962, 1963, 1964, 1965, 1966, 1967, 1968,
             1969, 1970, 1971, 1972, 1973, 1974, 1975, 1978, 1980, 1981, 1982,
             1983, 1984, 1985, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997,
             1998, 2000, 2001, 2002, 2003, 2004]
    autoindex:
      actif: true
    enumeration:
      actif: true
      max_numero: 60
      stop_apres_absents: 5

# ---------------------------------------------------------------------------
# Textes unitaires : URL explicite obligatoire (validée humainement).
#
# ⚠️ AVERTISSEMENT (mesure du 06/08/2026) — avant de compléter un `<à compléter>` :
# les PDF de textes isolés servis par sgg.cg sous /textes-officiels/ sont TOUS
# des scans sans couche texte, quelle que soit leur date. Vérifié sur les lois
# 2023-13 (8 p., 0 car.) et 1984-01 (7 p., 0 car.), et confirmé par l'agent de
# contre-vérification sur 16 autres (52-83, 53-83, 022-92, 026-92, 017-89, 35-61,
# 10-2004, 11-2004, 17-2000, 102-75, 021-1988, 013-92, 37-2012, 4-2010…).
# Remplir ces URL revient donc à s'imposer un OCR pour un texte que le JO
# correspondant fournit déjà en texte natif (si postérieur à 2005).
# La bonne façon d'obtenir un code ou une loi : ingérer le JO de publication via
# la série `jo-recents` / `jo-archives`, puis découper. N'utiliser une entrée
# `textes` que pour ce qui n'est PAS publié au JO congolais (actes uniformes
# OHADA, Accord de Bangui/OAPI, règlements CEMAC/UMAC, Code CIMA).
# ---------------------------------------------------------------------------
textes:
  - id: constitution-2015
    titre: Constitution du 25 octobre 2015 (et révision 2022)
    categorie: constitutionnel
    role: STOCK
    priorite: P0
    manifeste: sgg-autres
    dest: sgg/constitution
    type_source: constitution
    source:
      # Page SGG : https://www.sgg.cg/fr/journal-officiel/constitution.html
      # (le PDF est déjà dans data/sources/sgg/constitution/ — entrée rétro-remplie ;
      # compléter l'URL exacte du PDF pour la provenance définitive)
      url: "https://www.sgg.cg/fr/journal-officiel/constitution.html"

  # --- Codes nationaux prioritaires (travail, famille, pénal, foncier) -----
  # Les PDF sont pour la plupart déjà dans data/sources/sgg/codes/ (rétro-
  # remplis au manifeste). Compléter l'URL sgg.cg de chacun (via
  # https://www.sgg.cg/fr/recherche.html) pour boucler la provenance.
  - id: code-travail
    titre: Code du travail (loi n° 45-75 et textes modificatifs)
    categorie: travail
    role: STOCK
    priorite: P0
    manifeste: sgg-codes
    dest: sgg/codes
    type_source: code
    source: {url: "<à compléter>"}

  - id: code-famille
    titre: Code de la famille (loi n° 073/84)
    categorie: famille
    role: STOCK
    priorite: P0
    manifeste: sgg-codes
    dest: sgg/codes
    type_source: code
    source: {url: "<à compléter>"}

  - id: code-penal
    titre: Code pénal
    categorie: penal
    role: STOCK
    priorite: P1
    manifeste: sgg-codes
    dest: sgg/codes
    type_source: code
    source: {url: "<à compléter>"}

  - id: code-procedure-penale
    titre: Code de procédure pénale
    categorie: penal
    role: STOCK
    priorite: P1
    manifeste: sgg-codes
    dest: sgg/codes
    type_source: code
    source: {url: "<à compléter>"}

  - id: regime-foncier
    titre: Textes fonciers / domaine (à préciser)
    categorie: foncier
    role: STOCK
    priorite: P2
    manifeste: sgg-codes
    dest: sgg/codes
    type_source: code
    source: {url: "<à compléter>"}

  - id: loi-1998-08-genocide-crimes-guerre
    titre: "Loi n° 8/98 du 31 octobre 1998 portant définition et répression du génocide, des crimes de guerre et des crimes contre l'humanité"
    categorie: penal
    role: STOCK
    priorite: P2
    manifeste: sgg-lois
    dest: sgg/lois
    type_source: loi
    source: {url: "https://www.sgg.cg/textes-officiels/lois/1998/congo-loi-1998-08.pdf"}

  - id: au-suretes
    titre: "Acte uniforme portant organisation des sûretés (révisé)"
    categorie: ohada
    role: STOCK
    priorite: P1
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # Adopté 15/12/2010 à Lomé — date vérifiée dans le PDF lui-même (page de
    # garde JO OHADA, pas seulement la page de présentation ohada.org).
    source: {url: "http://biblio.ohada.org/pmb/opac_css/doc_num.php?explnum_id=483"}

  - id: au-recouvrement-voies-execution
    titre: "Acte uniforme portant organisation des procédures simplifiées de recouvrement et des voies d'exécution"
    categorie: ohada
    role: STOCK
    priorite: P1
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # Adopté 10/4/1998 à Libreville — jamais révisé depuis, date vérifiée dans
    # le PDF (JO OHADA du 1/7/1998).
    source: {url: "http://biblio.ohada.org/pmb/opac_css/doc_num.php?explnum_id=485"}

  - id: au-transport-marchandises-route
    titre: "Acte uniforme relatif aux contrats de transport de marchandises par route"
    categorie: ohada
    role: STOCK
    priorite: P2
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # Adopté 22/3/2003 à Yaoundé — jamais révisé depuis (pas de générique
    # « recent revision » signalée sur la page ohada.org, contrairement aux 4
    # actes ci-dessous). Date NON re-confirmée visuellement dans le PDF : la
    # page de garde est un scan sans couche texte exploitable. À vérifier en
    # revue éditeur si un doute survient.
    source: {url: "http://biblio.ohada.org/pmb/opac_css/doc_num.php?explnum_id=479"}

  # -------------------------------------------------------------------------
  # Les entrées OHADA ci-dessous sont sourcées sur des fac-similés du Journal
  # Officiel de l'OHADA, et leur MILLÉSIME a été lu sur la page de garde du PDF
  # lui-même (08/08/2026), jamais déduit de la page web : les fiches d'actes de
  # ohada.org exposent, derrière leur bouton « download », les versions
  # d'ORIGINE (1997/1998/1999) des actes pourtant révisés depuis. Les
  # `explnum_id` retenus ici ne sont donc PAS ceux que ces boutons proposent.
  # Ne jamais « corriger » une de ces URLs vers celle de la fiche officielle
  # sans rouvrir le PDF : ce serait revenir à une version abrogée.
  # -------------------------------------------------------------------------

  - id: au-commercial-general
    titre: "Acte uniforme portant sur le droit commercial général (révisé)"
    categorie: ohada
    role: STOCK
    priorite: P1
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # JO OHADA 15e année n° 21 du 15/02/2011 — « Adopté le 15 décembre 2010 à
    # Lomé », 307 articles (celui de 1997 s'arrêtait à 289), crée le statut
    # d'entreprenant. Le bouton de la fiche officielle sert explnum_id=481 = 1997.
    source: {url: "https://biblio.ohada.org/pmb/opac_css/doc_num.php?explnum_id=3954"}

  - id: au-societes-cooperatives
    titre: "Acte uniforme relatif au droit des sociétés coopératives"
    categorie: ohada
    role: STOCK
    priorite: P2
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # JO OHADA 15e année n° 23 du 15/02/2011 — « Adopté le 15 décembre 2010 à
    # Lomé », 397 articles. Acte créé ex nihilo en 2010 : sa clause finale
    # (art. 396) abroge les droits internes contraires, pas un acte antérieur.
    source: {url: "https://biblio.ohada.org/pmb/opac_css/doc_num.php?explnum_id=487"}

  - id: au-societes-gie
    titre: "Acte uniforme relatif au droit des sociétés commerciales et du groupement d'intérêt économique (révisé)"
    categorie: ohada
    role: STOCK
    priorite: P1
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # JO OHADA numéro spécial du 04/02/2014 — « Adoptés le 30 janvier 2014 à
    # Ouagadougou », 920 articles dont les art. 853-1 à 853-23 créant la SAS.
    # Le bouton de la fiche officielle sert explnum_id=486 = 1997.
    source: {url: "https://biblio.ohada.org/doc_num.php?explnum_id=2032"}

  - id: au-procedures-collectives
    titre: "Acte uniforme portant organisation des procédures collectives d'apurement du passif (révisé)"
    categorie: ohada
    role: STOCK
    priorite: P1
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # JO OHADA numéro spécial du 25/09/2015 — adopté le 10/09/2015 à
    # Grand-Bassam ; ajoute la conciliation et les procédures simplifiées.
    # Le bouton de la fiche officielle sert explnum_id=484 = 1998.
    source: {url: "https://biblio.ohada.org/doc_num.php?explnum_id=19"}

  - id: au-comptable-audcif
    titre: "Acte uniforme relatif au droit comptable et à l'information financière (AUDCIF)"
    categorie: ohada
    role: STOCK
    priorite: P1
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # JO OHADA numéro spécial du 15/02/2017 — adopté le 26/01/2017 à
    # Brazzaville, 113 articles. Le SYSCOHADA (plan comptable) est un document
    # distinct, volontairement hors de cette entrée.
    source: {url: "https://biblio.ohada.org/doc_num.php?explnum_id=2061"}

  - id: jo-ohada-2017-arbitrage-mediation
    titre: "Journal Officiel OHADA, numéro spécial du 15 décembre 2017 (arbitrage, médiation, règlement d'arbitrage CCJA)"
    categorie: ohada
    role: STOCK
    priorite: P1
    manifeste: ohada-actes
    dest: ohada/actes-uniformes
    type_source: acte_uniforme
    # ⚠️ RECUEIL À DÉCOUPER, pas un acte unique : ce seul PDF contient TROIS
    # textes — l'Acte uniforme relatif à la médiation (18 art.), l'Acte
    # uniforme relatif au droit de l'arbitrage (36 art., dont l'art. 36 qui
    # abroge expressément celui du 11 mars 1999) et le Règlement d'arbitrage
    # de la CCJA. Tous adoptés le 23/11/2017 à Conakry. Après parsing, passer
    # par suggest-boundaries-md / split-compilation-md avant structuration,
    # sinon on recrée un « Code Bleu Ohada » en miniature (numérotations qui
    # repartent à 1 dans un même document). Le bouton de la fiche arbitrage
    # sert explnum_id=480 = la version 1999 abrogée.
    source: {url: "https://biblio.ohada.org/doc_num.php?explnum_id=2799"}

